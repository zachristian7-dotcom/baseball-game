<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ArtShare · AI Verification</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
  <header class="top-header">
    <a class="logo" href="index.html">ArtShare</a>
    <form class="search-form" role="search"></form>
    <div class="header-controls">
      <a class="upload-btn btn" href="upload.html">Upload</a>
      <a class="notification-btn btn" href="notifications.html">Notifications</a>
      <div class="profile-menu"></div>
    </div>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="explore.html">Explore</a>
        <a class="nav-link" href="collection.html">Collection</a>
        <a class="nav-link" href="messages.html">Messages</a>
        <a class="nav-link" href="moderation.html">Moderation</a>
        <a class="nav-link" href="ai-policy.html">AI Policy</a>
        <a class="nav-link" href="ai-verification.html">AI Verification</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>
    </aside>
    <main class="main-content"><h1>AI Verification Request</h1><form id="verify-form" class="form-card mt-16"><div class="form-row"><label for="wipUrl">WIP image URL</label><input id="wipUrl" name="wipUrl" type="url" required></div><div class="form-row"><label for="processDesc">Describe your creation process</label><textarea id="processDesc" name="processDesc" required></textarea></div><button class="btn btn-primary">Submit verification</button></form><p id="verify-msg" class="mt-8"></p></main>
  </div>
  <script type="module">import {initApp} from './js/app.js';initApp();const f=document.getElementById('verify-form');f?.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f);const key='artshare_verification_requests';const arr=JSON.parse(localStorage.getItem(key)||'[]');arr.push({id:`v_${Date.now()}`,wipUrl:fd.get('wipUrl'),process:fd.get('processDesc'),createdAt:Date.now()});localStorage.setItem(key,JSON.stringify(arr));f.reset();document.getElementById('verify-msg').textContent='Verification submitted.';});</script>
</body>
</html>
