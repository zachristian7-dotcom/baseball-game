<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ArtShare · Upload</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
  <header class="top-header">
    <a class="logo" href="index.html">ArtShare</a>
    <form class="search-form" role="search"></form>
    <div class="header-controls">
      <a class="upload-btn btn" href="upload.html">Upload</a>
      <a class="notification-btn btn" href="notifications.html">Notifications</a>
      <div class="profile-menu"></div>
    </div>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <nav>
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="explore.html">Explore</a>
        <a class="nav-link" href="collection.html">Collection</a>
        <a class="nav-link" href="messages.html">Messages</a>
        <a class="nav-link" href="moderation.html">Moderation</a>
        <a class="nav-link" href="ai-policy.html">AI Policy</a>
        <a class="nav-link" href="ai-verification.html">AI Verification</a>
        <a class="nav-link" href="settings.html">Settings</a>
      </nav>
    </aside>
    <main class="main-content"><h1>Upload artwork</h1><form id="upload-form" class="form-card mt-16"><div class="form-row"><label for="title">Title</label><input id="title" name="title" required></div><div class="form-row"><label for="type">Type</label><select id="type" name="type" required><option value="">Select</option><option value="image">Image</option><option value="video">Video</option></select></div><div class="form-row"><label for="url">Content URL</label><input id="url" name="url" type="url" required></div><div class="form-row"><label for="poster">Poster URL (optional)</label><input id="poster" name="poster" type="url"></div><div class="form-row"><label for="description">Description</label><textarea id="description" name="description"></textarea></div><div class="form-row"><label><input type="checkbox" name="aiVerified" value="yes" required> I confirm this artwork is human-created and complies with AI policy.</label></div><button class="btn btn-primary" type="submit">Publish</button></form></main>
  </div>
  <script type="module">import {initApp} from './js/app.js';initApp();import {initUploadPage} from './js/upload.js';initUploadPage();</script>
</body>
</html>
